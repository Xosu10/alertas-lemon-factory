name: Parte de la huerta

on:
  workflow_dispatch:
    inputs:
      enviar_prueba:
        description: "Enviar un mensaje de prueba al canal (para comprobar el webhook)"
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
    # El "schedule" de GitHub no es fiable a esta frecuencia (puede tardar horas): queda solo como respaldo.
    # El disparo puntual llega por workflow_dispatch desde cron-job.org.

permissions:
  contents: write

# Una sola ejecución a la vez: así dos disparos seguidos nunca mandan el mismo aviso dos veces.
concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Enviar mensaje de prueba
        if: ${{ inputs.enviar_prueba }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python probar_discord.py

      - name: Ejecutar el parte
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FIRST_ALERT_MINUTES: ${{ vars.FIRST_ALERT_MINUTES }}
          SECOND_ALERT_MINUTES: ${{ vars.SECOND_ALERT_MINUTES }}
          SUMMARY_HOUR: ${{ vars.SUMMARY_HOUR }}
        run: python main.py

      - name: Guardar el registro de avisos ya enviados
        run: |
          git config user.name "parte-huerta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.db
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Actualizar registro de avisos enviados"
            git push || (git pull --rebase && git push)
          fi
